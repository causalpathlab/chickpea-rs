[package]
name = "chickpea-rs"
version = "0.7.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
authors = ["Yongjin Park <ypp@stat.ubc.ca> <yongjin.park@ubc.ca>"]
description = "Chromatin Interactions Captured by Knitting Peaks with Expression Anchors: peak-to-gene linkage"
repository = "https://github.com/causalpathlab/chickpea-rs"
homepage = "https://github.com/causalpathlab/chickpea-rs"
readme = "README.md"
keywords = ["genomics", "single-cell", "multiome", "peak-to-gene", "atac"]
categories = ["science", "command-line-utilities"]
exclude = [
    "**/.claude/**",
    "**/.DS_Store",
    "temp*/**",
]

[lib]
name = "chickpea"
path = "src/lib.rs"

[[bin]]
name = "chickpea"
path = "src/main.rs"

[features]
default = ["tui"]
# `chickpea run`, `chickpea view` and their sessions (`chickpea attach`);
# `p2g_run` in the background runs on `chickpea run`'s screen.
tui = [
    "dep:legume-tui",
    "dep:ratatui",
    "dep:ratatui-image",
    "dep:image",
    "legume-mcp/sessions",
]
cuda = [
    "legume-numeric/cuda",
    "graph-embedding-util/cuda",
]
metal = [
    "legume-numeric/metal",
    "graph-embedding-util/metal",
]
hdf5 = ["data-beans/hdf5"]

[dependencies]
data-beans = { version = "0.10", features = ["aux", "alg"] }
legume-numeric = { version = "0.9", features = ["matrix", "param", "candle", "mcmc"] }
genomic-data = { version = "0.6", package = "legume-genomic-types" }
graph-embedding-util = { version = "0.10", package = "legume-graph-embedding" }

anyhow = "1.0"
clap = { version = "4.5.20", features = ["derive"] }
tempfile = "3.2"
rand = "0.10.1"
nalgebra = "0.34"
nalgebra-sparse = "0.11"

colored = "3"
log = "0.4"
rustc-hash = "2.1"

# `chickpea mcp`: the Model Context Protocol on stdio.
legume-mcp = { version = "0.4", features = ["clap"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# The terminal front ends.
legume-tui = { version = "0.3", optional = true, features = ["form", "export", "map-display", "save", "browse"] }
ratatui = { version = "0.30", optional = true, default-features = false, features = ["crossterm"] }
ratatui-image = { version = "11.1", optional = true, default-features = false, features = ["crossterm"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
